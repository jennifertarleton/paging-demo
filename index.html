<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paging: one number</title>
  <!-- Week 6 Day 3 demo. Step through with Next / Back or the arrow keys. Jump to a screen with #N in the URL. -->
  <!-- Real numbers (checked live 11-20): 826 characters, 42 pages, page 1 starts Rick Sanchez, page 2 starts Aqua Morty, page 42 = 6 characters, page 43 = 404. -->
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
      --line: #e2dcd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 { margin: 24px 24px 0; font-size: 1.6rem; text-align: center; }

    .stage {
      flex: 1;
      max-width: 1150px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: center;
    }

    .code {
      border: 3px solid var(--blue);
      border-radius: 14px;
      background: white;
      padding: 12px 0;
      font-family: Consolas, monospace;
      font-size: 0.98rem;
    }

    .line {
      padding: 2px 16px;
      white-space: pre;
      border-left: 6px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .line.on { background: #fff1cc; border-left-color: var(--gold); }
    .line.dim { color: #b6bfcc; }

    .right { display: flex; flex-direction: column; gap: 16px; }

    .url {
      border: 2px solid var(--line);
      border-radius: 999px;
      background: white;
      padding: 8px 16px;
      font-family: Consolas, monospace;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .url b { color: var(--gold); font-size: 1.15rem; }

    .boxes { display: flex; gap: 12px; }

    .box {
      flex: 1;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 8px 12px;
      text-align: center;
    }

    .box .k { color: var(--muted); font-weight: 700; font-family: Consolas, monospace; }
    .box .v { font-family: Consolas, monospace; font-size: 1.8rem; font-weight: 700; transition: color 0.3s; }
    .box .math { color: var(--muted); font-family: Consolas, monospace; min-height: 1.3em; font-size: 0.9rem; }
    .box.pop .v { color: var(--green); }
    .box.bad .v { color: var(--red); }

    .pages { display: grid; grid-template-columns: repeat(21, 1fr); gap: 3px; }

    .pg {
      height: 18px;
      border-radius: 3px;
      background: #e9e4dc;
      font-size: 0.55rem;
      color: var(--muted);
      text-align: center;
      line-height: 18px;
      transition: background 0.3s;
    }

    .pg.current { background: var(--gold); color: white; font-weight: 700; }
    .pg.short { outline: 2px dashed var(--muted); }

    .mock {
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 10px 14px;
    }

    .mock .first { font-weight: 700; min-height: 1.4em; }
    .mock .first.bad { color: var(--red); }
    .mock .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

    .mock .btn {
      padding: 4px 14px;
      border-radius: 8px;
      border: 2px solid var(--ink);
      font-weight: 700;
      transition: opacity 0.3s, box-shadow 0.3s;
    }

    .mock .btn.off { opacity: 0.3; }
    .mock .btn.click { box-shadow: 0 0 0 5px #fde9b8; border-color: var(--gold); }
    .mock .label { font-weight: 700; font-family: Consolas, monospace; }

    .caption {
      max-width: 950px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.45rem;
      text-align: center;
    }

    code { font-family: Consolas, monospace; background: #f1ede7; padding: 1px 6px; border-radius: 4px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 24px 24px; }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next { background: var(--ink); color: white; }
    .controls button:disabled { opacity: 0.35; cursor: default; }
    .count { color: var(--muted); }

    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; }
      .code { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <h1>Paging: your code remembers one number</h1>

  <div class="stage">
    <div class="code" id="code"></div>

    <div class="right">
      <div class="url" id="url"></div>
      <div class="boxes">
        <div class="box" id="box-page"><div class="k">page</div><div class="v" id="v-page">–</div><div class="math" id="m-page"></div></div>
        <div class="box" id="box-total"><div class="k">totalPages</div><div class="v" id="v-total">–</div><div class="math" id="m-total"></div></div>
      </div>
      <div class="pages" id="pages"></div>
      <div class="mock">
        <div class="first" id="first"></div>
        <div class="bar">
          <span class="btn" id="m-prev">← Prev</span>
          <span class="label" id="m-label"></span>
          <span class="btn" id="m-next">Next →</span>
        </div>
      </div>
    </div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    const code = [
      "let page = 1;",
      "",
      "async function loadPage() {",
      "  const url = `...character?page=${page}`;",
      "  // fetch, loading, errors, showCards...",
      "  const totalPages = Math.ceil(data.info.count / 20);",
      "  pageLabel.textContent = `Page ${page} of ${totalPages}`;",
      "  prevButton.disabled = page === 1;",
      "  nextButton.disabled = page === totalPages;",
      "}",
      "",
      "function nextPage() {",
      "  page = page + 1;",
      "  loadPage();",
      "}",
      "",
      "function prevPage() {",
      "  page = page - 1;",
      "  loadPage();",
      "}"
    ];

    const firstOn = { 1: "20 cards · Rick Sanchez first", 2: "20 cards · Aqua Morty first", 3: "20 cards", 42: "only 6 cards (the last page)" };

    // Each step: caption, highlighted line(s), page, what the mock page shows.
    // off: lines from the "stop at the ends" part that aren't written yet (shown dim).
    const ends = [5, 6, 7, 8];
    const steps = [
      { text: "The API has <strong>826 characters</strong>. Nobody wants 826 at once! It sends <strong>20 at a time</strong>, in pages. Each little box is one page.",
        lines: [], off: ends, page: null },
      { text: "Your code remembers <strong>one number</strong>: the page you're on. It starts at 1. It's <code>let</code>, because it's going to change.",
        lines: [0], off: ends, page: 1, pageMath: "starts at 1", popPage: true },
      { text: "<code>loadPage</code> puts that number <strong>in the URL</strong> with <code>${page}</code>. Page 1: Rick Sanchez first.",
        lines: [3], off: ends, page: 1, showUrl: true, first: true },
      { text: "Click <strong>Next</strong>. <code>page = page + 1</code>: 1 + 1 = <strong>2</strong>.",
        lines: [12], off: ends, page: 2, pageMath: "1 + 1", popPage: true, click: "next", showUrl: true, oldFirst: 1 },
      { text: "Then <code>loadPage()</code> again. The URL now says <strong>page=2</strong>, so new characters: Aqua Morty first. Same function, new number.",
        lines: [13, 3], off: ends, page: 2, showUrl: true, first: true },
      { text: "Next again: <strong>3</strong>. Prev: <code>page - 1</code>, back to <strong>2</strong>. Only the number changes. The URL follows it.",
        lines: [17, 18], off: ends, page: 2, pageMath: "3 − 1", popPage: true, click: "prev", showUrl: true, first: true },
      { text: "<strong>Predict:</strong> you're on page 1. Click Prev. What is <code>page</code> now? Type it in the chat.",
        lines: [17], off: ends, page: 1, showUrl: true, first: true },
      { text: "<strong>0.</strong> Then −1. No error, and the API quietly sends page 1 again. And past the end, page 43, is a <strong>404</strong>. Your page number is wrong, and nobody can tell.",
        lines: [17], off: ends, page: 0, pageMath: "1 − 1", badPage: true, click: "prev", showUrl: true, bad: "page 0 → the API quietly sends page 1" },
      { text: "Fix part 1: <strong>how many pages?</strong> 826 ÷ 20 = 41.3. <code>Math.ceil</code> rounds <strong>up</strong> to 42: the last page only has 6, but it's still a page.",
        lines: [5], page: 1, total: "42", totalMath: "826 ÷ 20 = 41.3 → 42", popTotal: true, showUrl: true, first: true },
      { text: "Fix part 2: <strong>the label</strong>. Now the user can see where they are.",
        lines: [6], page: 1, total: "42", showUrl: true, first: true, label: true },
      { text: "Fix part 3: <strong>stop at the ends</strong>. <code>page === 1</code> is <code>true</code> on page 1, so Prev is <strong>disabled</strong>: grayed out, and clicks do nothing.",
        lines: [7], page: 1, total: "42", showUrl: true, first: true, label: true, endsOn: true },
      { text: "On page 42, <code>page === totalPages</code> is <code>true</code>, so <strong>Next</strong> is off. Only 6 cards. No page 43, no 404.",
        lines: [8], page: 42, total: "42", showUrl: true, first: true, label: true, endsOn: true },
      { text: "<strong>That's paging.</strong> One number, <code>page</code>. Next and Prev change it, <code>loadPage</code> puts it in the URL, and the label and buttons follow it.",
        lines: [0, 3, 12, 17], page: 2, total: "42", showUrl: true, first: true, label: true, endsOn: true }
    ];

    function el(id) { return document.getElementById(id); }

    // Build the 42 page boxes once.
    for (let p = 1; p <= 42; p++) {
      const box = document.createElement("div");
      box.className = "pg" + (p === 42 ? " short" : "");
      box.id = "pg-" + p;
      box.textContent = p;
      el("pages").appendChild(box);
    }

    let step = 0;

    function show() {
      const s = steps[step];

      el("code").innerHTML = "";
      code.forEach(function (text, n) {
        const line = document.createElement("div");
        let cls = "line";
        if (s.lines.indexOf(n) !== -1) cls += " on";
        else if (s.off && s.off.indexOf(n) !== -1) cls += " dim";
        line.className = cls;
        line.textContent = text || " ";
        el("code").appendChild(line);
      });

      const p = s.page;
      el("url").innerHTML = s.showUrl ? "https://rickandmortyapi.com/api/character?page=<b>" + p + "</b>" : "https://rickandmortyapi.com/api/character?page=<b>?</b>";

      el("v-page").textContent = p === null ? "–" : p;
      el("m-page").textContent = s.pageMath || "";
      el("box-page").classList.toggle("pop", !!s.popPage && !s.badPage);
      el("box-page").classList.toggle("bad", !!s.badPage);

      el("v-total").textContent = s.total || "–";
      el("m-total").textContent = s.totalMath || "";
      el("box-total").classList.toggle("pop", !!s.popTotal);

      for (let n = 1; n <= 42; n++) {
        el("pg-" + n).classList.toggle("current", n === p);
      }

      const first = el("first");
      first.classList.toggle("bad", !!s.bad);
      if (s.bad) first.textContent = s.bad;
      else if (s.first) first.textContent = firstOn[p] || "20 cards";
      else if (s.oldFirst) first.textContent = firstOn[s.oldFirst];
      else first.textContent = p ? "" : "826 characters, 20 per page";

      el("m-label").textContent = s.label ? "Page " + p + " of 42" : "";
      el("m-prev").classList.toggle("off", !!s.endsOn && p === 1);
      el("m-next").classList.toggle("off", !!s.endsOn && p === 42);
      el("m-prev").classList.toggle("click", s.click === "prev");
      el("m-next").classList.toggle("click", s.click === "next");

      el("caption").innerHTML = s.text;
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
      history.replaceState(null, "", "#" + (step + 1));
    }

    function jump() {
      const n = parseInt(location.hash.slice(1), 10);
      if (n >= 1 && n <= steps.length && n - 1 !== step) { step = n - 1; show(); }
    }

    el("next").addEventListener("click", function () { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", function () { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });
    window.addEventListener("hashchange", jump);

    const start = parseInt(location.hash.slice(1), 10);
    if (start >= 1 && start <= steps.length) step = start - 1;
    show();
  </script>
</body>
</html>
